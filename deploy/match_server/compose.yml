services:
  match:
    build:
      context: ../..
      dockerfile: deploy/match_server/Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "24840"
    environment:
      AGAIN_HERO_BIND: 0.0.0.0
      AGAIN_HERO_PORT: 24840
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MATCH_DOMAIN: ${MATCH_DOMAIN:?Set a public domain pointing to this host}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - match
volumes:
  caddy_data:
  caddy_config:
